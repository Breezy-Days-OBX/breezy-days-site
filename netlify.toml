[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.19.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Allow an authenticated Identity user with the owner role to receive the
# generated dashboard. The paired fallback rules keep the owner login helpful
# instead of returning Netlify's generic role-gate 404.
[[redirects]]
  from = "/owner/dashboard"
  to = "/owner/dashboard"
  status = 200
  force = true
  conditions = { Role = ["owner"] }

[[redirects]]
  from = "/owner/dashboard"
  to = "/owner"
  status = 401
  force = true

[[redirects]]
  from = "/owner/dashboard/*"
  to = "/owner/dashboard/:splat"
  status = 200
  force = true
  conditions = { Role = ["owner"] }

[[redirects]]
  from = "/owner/dashboard/*"
  to = "/owner"
  status = 401
  force = true

# Activate only after Netlify has assigned the production project and both
# custom hostnames are verified. Enabling this earlier would break deploy
# previews by forcing their hostnames onto a domain that may not be ready.
# [[redirects]]
#   from = "https://www.breezydaysobx.com/*"
#   to = "https://breezydaysobx.com/:splat"
#   status = 301
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms https://c.bing.com; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms; script-src-attr 'none'; style-src 'self'; worker-src 'self'; upgrade-insecure-requests"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/owner"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/owner/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
